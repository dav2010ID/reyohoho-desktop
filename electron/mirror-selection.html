<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Selection</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 20px;
        background: rgba(0, 0, 0, 0.88);
        color: #fff;
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .panel {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #151515;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 20px;
        font-weight: 650;
      }

      .label {
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 12px;
      }

      .current {
        margin-bottom: 18px;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        background: #202020;
        color: #9be58f;
        word-break: break-all;
        font-family: Consolas, "Courier New", monospace;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      input {
        min-width: 0;
        flex: 1;
        height: 38px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: #0f0f0f;
        color: #fff;
        font: inherit;
      }

      button {
        height: 38px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: #2b2b2b;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: #383838;
      }

      .primary {
        background: #e8e8e8;
        color: #111;
      }

      .primary:hover {
        background: #fff;
      }

      pre {
        display: none;
        max-height: 260px;
        overflow: auto;
        margin: 10px 0 18px;
        padding: 12px;
        border-radius: 6px;
        background: #0c0c0c;
        white-space: pre-wrap;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Выбор зеркала</h1>

      <div class="label">Текущее зеркало</div>
      <div class="current" id="currentMirror">Loading...</div>

      <div class="label">Ввести зеркало вручную</div>
      <div class="row">
        <input id="manualMirrorInput" type="url" placeholder="https://example.com">
        <button class="primary" id="applyButton">Применить</button>
      </div>

      <button id="listButton">Показать список зеркал</button>
      <pre id="mirrorsList"></pre>

      <div class="actions">
        <button id="cancelButton">Отмена</button>
        <button id="resetButton">Сбросить</button>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require('electron')

      let defaultMirror = ''

      const applyMirror = (url) => {
        try {
          const normalized = new URL(url).toString()
          ipcRenderer.send('mirror-selected', normalized)
        } catch {
          alert('Введите корректный URL, например https://example.com')
        }
      }

      const init = async () => {
        const config = await ipcRenderer.invoke('get-app-config')
        const storedMirror = await ipcRenderer.invoke('get-stored-mirror')

        defaultMirror = config?.main_site_url || ''
        document.getElementById('currentMirror').textContent = storedMirror || defaultMirror
      }

      document.getElementById('applyButton').addEventListener('click', () => {
        applyMirror(document.getElementById('manualMirrorInput').value.trim())
      })

      document.getElementById('manualMirrorInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          applyMirror(event.currentTarget.value.trim())
        }
      })

      document.getElementById('resetButton').addEventListener('click', () => {
        applyMirror(defaultMirror)
      })

      document.getElementById('cancelButton').addEventListener('click', () => {
        ipcRenderer.send('mirror-cancelled')
      })

      document.getElementById('listButton').addEventListener('click', async () => {
        const list = document.getElementById('mirrorsList')
        list.textContent = await ipcRenderer.invoke('get-mirrors-list')
        list.style.display = list.style.display === 'block' ? 'none' : 'block'
      })

      init()
    </script>
  </body>
</html>
